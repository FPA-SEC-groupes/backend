# =====================================================================
# HelloWay API — configuration
# Aucune valeur secrète ici : tout vient des variables d'environnement
# ou du fichier .env local (non versionné, voir .env.example).
# =====================================================================
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}
application.title=HelloWay
application.version=1

# --- Base de données MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT (cookie) ---
employeemanager.app.jwtSecret=${JWT_SECRET}
employeemanager.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
employeemanager.app.jwtCookieName=helloWay

# --- E-mail (code de réinitialisation du mot de passe) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Firebase (notifications push) : chemin du fichier de compte de service ---
firebase.credentials-path=${FIREBASE_CREDENTIALS:}

# --- CORS : origines autorisées des applications web, séparées par des virgules ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# --- Premier compte admin (créé seulement si aucun admin n'existe) ---
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Fichiers ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --- Divers ---
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true
spring.jackson.serialization.fail-on-empty-beans=false
management.metrics.enable.processor=false
management.metrics.enable.system=false
management.metrics.enable.tomcat=false
management.metrics.export.defaults.enabled=false
logging.level.org.springframework.security=WARN
